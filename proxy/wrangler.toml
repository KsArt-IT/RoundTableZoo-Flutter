name = "roundtablezoo-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# --- Отладочный контур -----------------------------------------------------
# Свои D1/KV, свои секреты (proxy/.dev.vars, в репозиторий не попадает).
# ALLOW_UNVERIFIED_INTEGRITY существует ТОЛЬКО здесь — код проверяет и его, и
# ENVIRONMENT === "dev" вместе, поэтому послабление недостижимо в проде даже
# при ошибке конфигурации (research.md R11).
[env.dev]
name = "roundtablezoo-ai-proxy-dev"

[env.dev.vars]
ENVIRONMENT = "dev"
ALLOW_UNVERIFIED_INTEGRITY = "1"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "roundtablezoo-ai-dev"
database_id = "847f4664-d7ea-4b51-b4a9-a344fcc554d2" # wrangler d1 create roundtablezoo-ai-dev

[[env.dev.kv_namespaces]]
binding = "CONFIG"
id = "581a023bdfd6443993ecf22ab0353127" # wrangler kv namespace create CONFIG --env dev

[env.dev.triggers]
crons = ["0 3 * * *"]

# --- Продовый контур --------------------------------------------------------
# Отдельные D1/KV, отдельные секреты (wrangler secret put --env production).
# ALLOW_UNVERIFIED_INTEGRITY здесь нет и быть не должно (FR-031) — proxy/test/env.test.ts
# проверяет это по разобранному конфигу.
[env.production]
name = "roundtablezoo-ai-proxy"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "roundtablezoo-ai"
database_id = "<REPLACE_WITH_PRODUCTION_D1_ID>" # wrangler d1 create roundtablezoo-ai

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "<REPLACE_WITH_PRODUCTION_KV_ID>" # wrangler kv namespace create CONFIG --env production

[env.production.triggers]
crons = ["0 3 * * *"]
