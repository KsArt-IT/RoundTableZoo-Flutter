name: roundtablezoo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  # Freezed
  freezed_annotation: ^3.1.0
  # JSON Serialization
  json_annotation: ^4.12.0
  # Navigation
  go_router: ^17.5.0
  # DI
  get_it: ^9.2.1
  injectable: ^3.0.0
  # Database
  drift: ^2.34.3 # Локальная SQLite база 
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  # Local Notifications
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  # Permission
  permission_handler: ^13.0.1
  # Device info
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  # Toast
  toastification: ^3.2.0
  # Splash screen
  flutter_native_splash: ^2.4.8
  # Utils
  collection: ^1.19.1
  path_provider: ^2.1.6
  path: ^1.9.1
  logger: ^2.7.0
  vibration: ^3.2.0
  url_launcher: ^6.3.2
  app_settings: ^8.0.3
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.0
  injectable_generator: ^3.1.3
  # Riverpod
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  # Freezed
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  # Database
  drift_dev: ^2.34.5

  flutter_lints: ^6.0.0

  # Test
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqlite3: ^3.5.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  config:
    enable-swift-package-manager: true

flutter_gen:
  line_length: 100
